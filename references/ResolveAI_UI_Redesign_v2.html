function overview(){const needs=cases.filter(c=>c.status==='HANDOFF_QUEUED').length+refunds.filter(r=>r.decision==='PENDING').length;const chart=[[80,55],[88,60],[94,72],[86,65],[96,70],[98,78],[100,84]];return Page('Good morning, Olivia.','See what needs attention across support, knowledge, and your store connection.',Btn(`${icon('inbox',14)} Open inbox`,'nav-inbox')+Btn(`${icon('flask',14)} Test AI`,'nav-playground','primary'))+`<div class="flag warning">${icon('info',17)} <span><b>Design prototype.</b> All customer, order, policy, and activity data on this screen are fictional. No live Shopify, AI model, or payment connection.</span></div><div class="pilot-banner"><div><div class="eyebrow" style="color:#64dfc4">MERCHANT PILOT</div><h2>One connected workflow. Real evidence. Human control.</h2><p>Connect your store, publish trusted policies, answer customers, and resolve escalations—with refund execution remaining in your own system.</p></div>${Btn(`${icon('arrow',15)} Finish setup`,'nav-onboarding','primary')}</div><div class="grid g4" style="margin-bottom:17px">${Metric('Active conversations',cases.length,'Synthetic merchant workspace','chat')}${Metric('Handoffs queued',cases.filter(c=>c.status==='HANDOFF_QUEUED').length,'Awaiting an assigned agent','headset')}${Metric('Refunds awaiting review',refunds.filter(r=>r.decision==='PENDING').length,'No payment action taken','shield')}${Metric('Published policy sources',docs.filter(d=>d.status==='PUBLISHED').length,'Only published releases are retrievable','book')}</div><div class="grid g73"><section class="card pad"><div class="section-head"><div><div class="section-title">Support activity</div><div class="section-sub">Illustrative weekly trend · sample data only</div></div>${B('PREVIEW DATA','gray')}</div><div class="chart">${chart.map((pair,i)=>`<div class="barpair"><i style="height:${pair[0]}%"></i><i class="strong" style="height:${pair[1]}%"></i><small>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</small></div> tton><button data-action="widget-example" data-value="Where is order ORD-1042?">Track order</button><button data-action="widget-handoff">Talk to a person</button></div></div><form id="widgetForm" class="widget-footer"><input class="input" name="message" placeholder="Type your question…" aria-label="Customer message" required><button class="btn primary" type="submit" aria-label="Send message">${icon('send',16)}</button></form></div></div>`}

function ticketsPage(){const data=[{id:'T-584',case:'C-584',customer:'Sarah Ahmed',subject:'Delayed shipment investigation',priority:'High',status:cases.find(c=>c.id==='C-584').status},{id:'T-580',case:'C-580',customer:'Imran Chowdhury',subject:'Refund approval follow-up',priority:'High',status:cases.find(c=>c.id==='C-580').status},{id:'T-579',case:'C-579',customer:'Nadia Rahman',subject:'Return policy resolved',priority:'Low',status:cases.find(c=>c.id==='C-579').status},{id:'T-574',case:'C-574',customer:'Rafi Khan',subject:'Delivery follow-up',priority:'Normal',status:cases.find(c=>c.id==='C-574').status}];return Page('Support tickets','Track follow-up work and open the correct customer conversation without changing staff roles.',Btn(`${icon('inbox',14)} Open conversations`,'nav-inbox'))+`<div class="flag soft">${icon('info',17)} <span>Ticket and case records below are linked sample entities. In production, ticket status, assignment, and timestamps come from authoritative FastAPI endpoints.</span></div><div class="grid g3" style="margin-bottom:16px">${Metric('Open tickets',data.filter(t=>t.status!=='RESOLVED').length,'Unresolved synthetic tickets','receipt')}${Metric('Waiting for human',data.filter(t=>t.status==='HANDOFF_QUEUED').length,'Support team queue','headset')}${Metric('Resolved tickets',data.filter(t=>t.status==='RESOLVED').length,'Completed sample cases','check')}</div><div class="card pad"><div class="section-head"><div><div class="section-title">Ticket queue</div><div class="section-sub">Select any ticket to inspect its linked conversation and source evidence</div></div>${B('SAMPLE DATA','blue')}</div><div class="tablewrap"><table class="table"><thead><tr><th>Ticket</th><th>Customer</th><th>Issue</th><th>Priority</th><th>Conversation state</th><th>Linked case</th></tr></thead><tbody>${data.map(t=>`<tr data-action="select-ticket" data-id="${t.case}"><td class="maincell">${t.id}</td><td>${esc(t.customer)}</td><td>${esc(t.subject)}</td><td>${B(t.priority)} function integrationsPage(){const caps=[['Orders read','ORDERS_READ'],['Fulfillment read','FULFILLMENT_READ'],['Payment status read','PAYMENT_STATUS_READ'],['Existing refund status read','REFUND_STATUS_READ']];return Page('Store integration','Verify Shopify connection permissions and understand which data ResolveAI can actually retrieve.',Btn(`${icon('store',14)} Setup guide`,'nav-onboarding'))+`<div class="flag warning">${icon('lock',17)} <span><b>Read-only pilot.</b> Shopify writes and real refund execution are not part of this release. Preview status does not represent real granted scopes.</span></div><div class="grid g64"><section class="card pad"><div class="section-head"><div><div class="section-title">Shopify connection</div><div class="section-sub">ShopEase sample · shop-ease-demo.myshopify.com</div></div>${B(state.storeVerified?'SIMULATED CAPABILITIES':'NOT CONNECTED',state.storeVerified?'blue':'amber')}</div>${K('Integration mode',B('READ ONLY','blue'))}${K('Store verified','No live credentials')}${K('Connection health',state.storeVerified?'Sample capability check only':'Not verified')}${K('Protected customer data','Requires appropriate provider permissions')}${K('Order history','Provider access restrictions may apply')}<div class="actions" style="margin-top:20px">${Btn(`${icon('refresh',14)} Run simulated capability check`,'sim-store','primary')}</div><div class="helper" style="margin-top:12px">The real backend will implement merchant OAuth/app authorization, scope verification, encrypted credentials and tenant-bound data retrieval.</div></section><section class="card pad"><div class="section-head"><div><div class="section-title">Data capability matrix</div><div class="section-sub">A connection is not equivalent to data access</div></div>${B('PER CAPABILITY','gray')}</div><div style="margin-top:14px">${caps.map(([label,key])=>`<div class="cap-row"><div><b>${label}</b><br><span>${key}</span></div>${B(state.storeVerified?'SAMPLE AVAILABLE':'NOT VERIFIED',st function settingsPage(){return Page('Workspace settings','Essential workspace configuration with backend-enforced security defaults.',Btn(`${icon('users',14)} Team permissions`,'nav-team'))+`<div class="grid g64"><section class="card pad"><div class="section-title">Workspace profile</div><div class="grid g2" style="margin-top:18px"><div class="field"><label>Workspace</label><input class="input" value="ShopEase Workspace" readonly></div><div class="field"><label>Primary integration</label><input class="input" value="Shopify (read-only pilot)" readonly></div><div class="field"><label>Support language</label><input class="input" value="English (sample)" readonly></div><div class="field"><label>Financial execution</label><input class="input" value="External merchant system" readonly></div></div><div class="flag soft" style="margin-top:23px">${icon('info',17)} Profile fields are read-only in this concept. In the real application, only authorized administrators can update workspace configuration.</div></section><aside class="card pad"><div class="section-title">Non-configurable security boundaries</div><div class="section-sub">These are enforced by the backend, not optional AI toggles</div><div style="margin-top:18px">${K('Tenant isolation',B('REQUIRED','green'))}${K('Order ownership checks',B('REQUIRED','green'))}${K('Financial human approval',B('REQUIRED','green'))}${K('No autonomous refund writes',B('ENFORCED','green'))}${K('Internal policy isolation',B('REQUIRED','green'))}</div><div class="notice-inline" style="margin-top:18px">${icon('lock',16)} Merchants cannot disable core authorization or financial safeguards with an AI settings switch.</div></aside></div>`}

${Btn('Inspect knowledge','nav-knowledge')}</div></aside></div>`}
function teamPage(){return Page('Team & access','One merchant console with distinct staff privileges; server policy is authoritative.',Btn(`${icon('shield',14)} Review audit`,'nav-audit'))+`<div class="card pad"><div class="section-head"><div><div class="section-title">Staff role model</div><div class="section-sub">Preview grants; no real user provisioning</div></div>${B('DEMO','blue')}</div><div class="tablewrap"><table class="table"><thead><tr><th>Role</th><th>Support conversations</th><th>Refund decisions</th><th>Policy publishing</th></tr></thead><tbody><tr><td class="maincell">Workspace Admin</td><td>Read / with support grant</td><td>Not by default</td><td>Yes</td></tr><tr><td class="maincell">Support Agent</td><td>Claim / reply / resolve</td><td>Create review only</td><td>Read</td></tr><tr><td class="maincell">Refund Approver</td><td>Linked case context</td><td>Approve / reject (not own)</td><td>No</td></tr></tbody></table></div><div class="flag soft" style="margin-top:21px">${icon('lock',17)} Role selector in the header is only a UI preview. Real enforcement requires workspace membership, action permissions, separation of duties, and server-side ownership checks.</div></div>`}

function statePreview(){let p={loading:['Loading workspace data','Fetching server-authoritative records. Actions remain disabled until the response is confirmed.','clock'],empty:['Nothing here yet','No records match this view. Connect a store or create the first item to get started.','inbox'],error:['This service is temporarily unavailable','The last known data may be stale. Retry safely or continue with another workspace task.','alert'],denied:['You cannot access this resource','Your current role or workspace membership does not permit this action. No protected data is displayed.','lock']}[state.preview];return `<div class="state-preview"><div class="card empty-state"><div class="symbol">${icon(p[2],26)}</div><h3>${p[0]}</h3><p>${p[1]}</p>${Btn(`${icon('refresh',15)} Return to default view`,'reset-preview','primary')}</div><div class="helper" style="text-align:center;margin-top:13px">UX state preview only. Real errors and permissions must come from FastAPI responses.</div></div>`}
function modal(){if(!state.modal)return '';let r=refunds.find(x=>x.id===state.selectedRefund);let title='',sub='',body='',action='',confirm='Confirm';switch(state.modal){case 'upload':title='Add a policy draft';sub='Creates a local demo entry. A real product would upload, parse, index, validate, then publish.';body=`<div class="field"><label>Policy title</label><input class="input" id="modalTitle" value="New support policy"></div><div class="field" style="margin-top:13px"><label>Policy version</label><input class="input" id="modalVersion" value="v1.0"></div>`;action='confirm-upload';confirm='Create draft';break;case 'approve':title='Approve this refund request?';sub='Approval records a business decision. It does not issue a refund through Shopify or any payment provider.';body=`<div class="flag warning">${icon('alert',16)} The execution state will become EXTERNAL_ACTION_REQUIRED, not COMPLETED.</div>${K('Request',r.id)}${K('Amount',`৳${r.amount.toLocaleString()} ${r.currency}`)}${K('Decision actor','Approver preview · Maya')}`;action='confirm-approve';confirm='Approve request only';break;case 'reject':title='Reject refund request';sub='Provide a reason that the customer-support team can explain.';body=`<div class="field"><label>Rejection reason</label><textarea class="textarea" id="rejectReason" placeholder="Why is this request rejected?" required></textarea></div>`;action='confirm-reject';confirm='Reject request';break;case 'report':title='Report an external action';sub='A merchant report is not independently verified payment evidence.';body=`<div class="field"><label>Merchant reference / note</label><input class="input" id="externalRef" placeholder="e.g. merchant-case-2026-01" required></div><div class="flag warning" style="margin-top:15px">${icon('info',15)} This will mark EXTERNAL_REPORTED, not PROVIDER_VERIFIED_COMPLETED.</div>`;action='confirm-report';confirm='Save unverified report';break;case 'evidence':{let c=cases.find(x=>x.id===state.selectedCase),o=orders.find(x=>x.id===c.order);title='Case evidence';sub=`${c.id} · ${c.name} · ${c.order}`;body=`${K('Order',esc(c.order))}${K('Shipment',o?esc(o.status):'Unavailable')}${K('Policy',esc(c.policy))}<div class="timeline">${c.evidence.map(x=>`<div class="time-item"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('')}</div>`;confirm='Done';action='close-modal';break;}default:return '';}return `<div class="modal-backdrop" data-action="close-modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalheading" ><div class="section-head"><div><h2 id="modalheading">${title}</h2><p>${sub}</p></div><button class="btn sm square" data-action="close-modal" aria-label="Close dialog">${icon('x',17)}</button></div>${body}<div class="actions" style="justify-content:flex-end;margin-top:25px">${Btn('Cancel','close-modal')}${Btn(confirm,action,state.modal==='reject'?'danger':'primary')}</div></div></div>`}
function render(){if(!roleAllowed(state.page))state.page='overview';const views={overview,onboarding,integrations:integrationsPage,knowledge,playground,inbox,tickets:ticketsPage,refunds:refundsPage,orders:ordersPage,widget:widgetPage,evaluations,team:teamPage,audit:auditPage,settings:settingsPage};const body=state.preview==='normal'?(views[state.page]||overview)():statePreview();document.getElementById('app').innerHTML=`<div class="overlay-mobile ${state.mobile?'show':''}" data-action="mobile-close"></div><div class="app-shell">${sidebar()}<main class="main">${head()}<div class="content">${body}</div></main></div>${modal()}`;document.title='ResolveAI · '+(titles[state.page]||'Overview');document.querySelectorAll('.msg-scroller,.widget-body').forEach(x=>x.scrollTop=x.scrollHeight)}
let toastTimer;function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3700)}
function move(page){state.page=page;state.mobile=false;state.preview='normal';render();window.scrollTo(0,0)}
function setAction(el){const a=el.dataset.action,id=el.dataset.id,val=el.dataset.value;if(!a)return;const c=cases.find(x=>x.id===state.selectedCase),r=refunds.find(x=>x.id===state.selectedRefund);if(a.startsWith('nav-'))return move(a.slice(4));switch(a){case 'mobile-open':state.mobile=true;break;case 'mobile-close':state.mobile=false;break;case 'reset-preview':state.preview='normal';break;case 'onboard-step':state.onboard=Number(id);break;case 'onboard-next':state.onboard=Math.min(3,state.onboard+1);if(state.onboard===3)toast('Review widget installation requirements before the live pilot.');break;case 'onboard-prev':state.onboard=Math.max(0,state.onboard-1);break;case 'sim-store':state.storeVerified=true;toast('Sample capability check complete — not a live Shopify connection.');break;case 'sim-widget':state.widgetInstalled=true;toast('Widget activation simulated. No storefront was modified.');break;case 'modal-upload':state.modal='upload';break;case 'select-doc':state.selectedDoc=id;break;case 'index-doc':{let d=docs.find(x=>x.id===state.selectedDoc);if(d&&d.status==='DRAFT'){d.status='INDEXED';toast('Demo indexing finished. Document is not published.')}break;}case 'validate-doc':{let d=docs.find(x=>x.id===state.selectedDoc);if(d&&d.status==='INDEXED'){d.status='VALIDATED';d.tested=true;toast('Sample validation passed; publication still required.')}break;}case 'publish-doc':{let d=docs.find(x=>x.id===state.selectedDoc);if(d&&d.status==='VALIDATED'){docs.forEach(x=>{if(x.category===d.category&&x.id!==d.id&&x.status==='PUBLISHED')x.status='ARCHIVED'});d.status='PUBLISHED';audit.unshift(['Just now','Knowledge release published',d.id+' · '+d.version]);toast('Demo policy published; previous category version archived.')}break;}case 'clear-play':state.playMessages=[];state.playEvidence=false;break;case 'play-example':addPlay(val);return;case 'filter-case':state.caseFilter=val;if(!cases.some(x=>x.id===state.selectedCase&&(val==='All'||x.status===val))){let f=cases.find(x=>val==='All'||x.status===val);if(f)state.selectedCase=f.id}break;case 'select-case':state.selectedCase=id;state.page='inbox';break;case 'select-ticket':state.selectedCase=id;state.page='inbox';break;case 'claim-case':if(state.role!=='Support'){toast('Support role required.');return}if(c.status!=='HANDOFF_QUEUED'){toast('Conversation changed — refresh required.');return}c.status='HUMAN_ACTIVE';c.assignee='You';c.version++;audit.unshift(['Just now','Human takeover',c.id+' · Support Agent preview']);toast('Human ownership assigned in demo. Automatic AI replies blocked.');break;case 'escalate-case':if(c.status==='AI_ACTIVE'){c.status='HANDOFF_QUEUED';c.version++;toast('Case queued for human support (demo).')}break;case 'resolve-case':if(c.assignee==='You'&&c.status==='HUMAN_ACTIVE'){c.status='RESOLVED';c.version++;toast('Conversation resolved (demo).')}break;case 'show-evidence':state.modal='evidence';break;case 'select-refund':state.selectedRefund=id;state.page='refunds';break;case 'refund-filter':state.refundFilter=val;{let f=refunds.find(x=>val==='All'||x.decision===val);if(f)state.selectedRefund=f.id}break;case 'modal-approve':if(state.role==='Approver'&&r.decision==='PENDING')state.modal='approve';else toast('Approver permission or pending decision required.');break;case 'modal-reject':if(state.role==='Approver'&&r.decision==='PENDING')state.modal='reject';else toast('Approver permission or pending decision required.');break;case 'modal-report':if(r.decision==='APPROVED'&&r.execution==='EXTERNAL_ACTION_REQUIRED')state.modal='report';break;case 'confirm-approve':if(r&&state.role==='Approver'&&r.decision==='PENDING'){r.decision='APPROVED';r.execution='EXTERNAL_ACTION_REQUIRED';r.audit.push('Approved by Maya (demo)', 'External merchant action required — no payment write');audit.unshift(['Just now','Refund review approved',r.id+' · external action required']);toast('Request approved. No refund has been executed.')}state.modal=null;break;case 'confirm-reject':{let reason=document.getElementById('rejectReason')?.value?.trim();if(!reason){toast('Enter a rejection reason first.');return}if(r&&state.role==='Approver'&&r.decision==='PENDING'){r.decision='REJECTED';r.execution='NOT_STARTED';r.audit.push('Rejected by Maya · '+reason);audit.unshift(['Just now','Refund review rejected',r.id]);toast('Request rejected (demo).')}state.modal=null;break;}case 'confirm-report':{let ref=document.getElementById('externalRef')?.value?.trim();if(!ref){toast('Enter a reference first.');return}if(r&&r.decision==='APPROVED'&&r.execution==='EXTERNAL_ACTION_REQUIRED'){r.ref=ref;r.execution='EXTERNAL_REPORTED';r.audit.push('Merchant reported external action · not independently verified');toast('Unverified external report saved. Not marked as completed.')}state.modal=null;break;}case 'reconcile-refund':if(r.execution==='EXTERNAL_REPORTED'){r.execution='RECONCILIATION_REQUIRED';r.audit.push('Provider verification unavailable — reconciliation required');toast('No trusted transaction evidence available. Reconciliation required.')}break;case 'select-order':state.selectedOrder=id;state.page='orders';break;case 'widget-example':addWidget(val);return;case 'widget-handoff':{state.widgetHandoff=true;state.widgetMessages.push(['customer','I would like to talk to a person.'],['ai','I have requested a human support handoff. An agent has not joined yet.']);let sarah=cases.find(x=>x.id==='C-584');if(sarah.status==='AI_ACTIVE')sarah.status='HANDOFF_QUEUED';toast('Human handoff queued in demo.');break;}case 'sim-verify':state.widgetVerified=true;state.widgetPendingOrder=false;state.widgetMessages.push(['ai','Demo identity verified. Sample order ORD-1042 is still in transit; promised delivery 18 Nov 2026. No real customer data was accessed.']);toast('Identity verification simulated, not real.');break;case 'close-modal':state.modal=null;break;case 'close-modal-backdrop':state.modal=null;break;case 'confirm-upload':{let title=document.getElementById('modalTitle')?.value?.trim(),version=document.getElementById('modalVersion')?.value?.trim();if(!title||!version){toast('Title and version are required.');return}const id2='KB-'+(110+docs.length);docs.unshift({id:id2,name:title,version,category:'OTHER',status:'DRAFT',sections:0,date:'Today',tested:false,text:'New draft. Content upload, parsing, and indexing will be implemented against the backend.'});state.selectedDoc=id2;state.modal=null;toast('Demo policy draft created — not indexed or published.');break;}default:return;}render()}
function addPlay(q){if(!q)return;state.playMessages.push({role:'user',text:q});if(/order|ORD-/i.test(q)&&!/policy/i.test(q)){state.playMessages.push({role:'assistant',text:'This requires an authorized order API lookup, not policy retrieval. No private order records are fetched in this preview.'});state.playEvidence=false}else{state.playMessages.push({role:'assistant',text:'A refund or delivery review must use the applicable published policy and the backend eligibility rules. Source: Delivery & Delay Policy v2.3, §2.1 (sample).'});state.playEvidence=true}render()}
function addWidget(q){if(!q)return;state.widgetMessages.push(['customer',q]);if(/agent|person|human/i.test(q)){state.widgetHandoff=true;state.widgetMessages.push(['ai','I have asked our support team to join. You are in the handoff queue, and no agent has joined yet.']);let sarah=cases.find(x=>x.id==='C-584');if(sarah.status==='AI_ACTIVE')sarah.status='HANDOFF_QUEUED'}else if(/order|ORD-|refund status|payment/i.test(q)){if(!state.widgetVerified){state.widgetPendingOrder=true;state.widgetMessages.push(['ai','I can help with private order details after verifying your identity. Please complete the verification step shown below.'])}else{state.widgetMessages.push(['ai','For this demo, order ORD-1042 is in transit and overdue. A refund requires a separate eligibility check and human approval.'])}}else if(/refund|return|policy|delivery/i.test(q)){state.widgetMessages.push(['ai','Here is the published store policy relevant to your question. Refund reviews require backend eligibility checks and human approval. Source: Refund Eligibility Policy v3.1, §4.2 (sample).'])}else{state.widgetMessages.push(['ai','I can help with store policy questions or connect you with human support. To check a private order, identity verification is required.'])}render()}
document.addEventListener('click',(e)=>{let el=e.target.closest('[data-page],[data-action]');if(!el)return;if(el.dataset.action==='close-modal-backdrop'&&e.target!==el)return;if(el.dataset.page){move(el.dataset.page);return}setAction(el)});
document.addEventListener('change',(e)=>{let el=e.target;if(el.dataset.change==='role'){state.role=el.value;if(!roleAllowed(state.page))state.page='overview';state.preview='normal';render()}else if(el.dataset.change==='preview'){state.preview=el.value;render()}});
document.addEventListener('submit',(e)=>{e.preventDefault();let form=e.target;if(form.id==='widgetForm'){let q=form.elements.message.value.trim();addWidget(q)}else if(form.id==='playForm'){let q=form.elements.question.value.trim();addPlay(q)}else if(form.id==='replyForm'){let c=cases.find(x=>x.id===state.selectedCase),q=form.elements.reply.value.trim();if(state.role==='Support'&&c.status==='HUMAN_ACTIVE'&&c.assignee==='You'&&q){c.msgs.push(['agent',q]);c.version++;toast('Demo human response added.');render()}}});
render();
</script>
</body></html>
